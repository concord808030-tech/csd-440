<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Miguel Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; max-width: 500px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select { padding: 6px; width: 100%; }
    button { margin-top: 20px; padding: 8px 20px; }
  </style>
</head>
<body>

<h1>Employee Registration</h1>
<p>All fields are required.</p>

<form action="MiguelResponse.php" method="post">

  <label for="name">Full Name</label>
  <input type="text" id="name" name="name">

  <label for="email">Email</label>
  <input type="text" id="email" name="email">

  <label for="age">Age</label>
  <input type="text" id="age" name="age">

  <label for="rate">Hourly Rate</label>
  <input type="text" id="rate" name="rate">

  <label for="startDate">Start Date</label>
  <input type="date" id="startDate" name="startDate">

  <label for="dept">Department</label>
  <select id="dept" name="dept">
    <option value="">-- Select --</option>
    <option value="Engineering">Engineering</option>
    <option value="Marketing">Marketing</option>
    <option value="Operations">Operations</option>
  </select>

  <label for="remote">Works Remotely</label>
  <select id="remote" name="remote">
    <option value="">-- Select --</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
  </select>

  <button type="submit">Submit</button>

</form>

</body>
</html>
