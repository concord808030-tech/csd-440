<!DOCTYPE html>
<!--
    File:        miguel_json_form.html
    Author:      Miguel
    Date:        2026-09-29
    Course:      Module 10 - JSON Encoding with PHP
    Description: HTML form that collects twelve fields of user information and
                 submits them via POST to "miguel_json.php". The PHP CGI
                 script validates the data, encodes it with json_encode(),
                 and displays the resulting JSON (or an error display).
    AI Use:      Claude Code (Anthropic) was used to help check for bugs
                 and to write and improve comments.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miguel JSON Form</title>
    <style>
        /* ---------- Page layout ---------- */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px 16px;
            color: #222;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            padding: 28px 32px;
        }
        h1 {
            margin-top: 0;
            color: #1f4e79;
            text-align: center;
        }
        p.note {
            text-align: center;
            color: #555;
            font-size: 0.9em;
        }

        /* ---------- Form fields ---------- */
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .field {
            flex: 1 1 250px;
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }
        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid #b8c4d2;
            border-radius: 6px;
            font-size: 1em;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .required {
            color: #c0392b;
        }

        /* ---------- Buttons ---------- */
        .buttons {
            text-align: center;
            margin-top: 10px;
        }
        button {
            background: #1f4e79;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 22px;
            font-size: 1em;
            cursor: pointer;
            margin: 0 6px;
        }
        button[type="reset"] {
            background: #7f8c8d;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Customer Information Form</h1>
    <p class="note">Fields marked with <span class="required">*</span> are required.</p>

    <!--
        The form posts to the PHP CGI script. "novalidate" is set so the
        server-side validation (and its error display) can be tested directly.
    -->
    <form action="miguel_json.php" method="post" novalidate>

        <!-- Field 1 & 2: First and last name -->
        <div class="row">
            <div class="field">
                <label for="firstName">First Name <span class="required">*</span></label>
                <input type="text" id="firstName" name="firstName" maxlength="50">
            </div>
            <div class="field">
                <label for="lastName">Last Name <span class="required">*</span></label>
                <input type="text" id="lastName" name="lastName" maxlength="50">
            </div>
        </div>

        <!-- Field 3 & 4: Email and phone -->
        <div class="row">
            <div class="field">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" maxlength="100">
            </div>
            <div class="field">
                <label for="phone">Phone (###-###-####) <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="555-123-4567">
            </div>
        </div>

        <!-- Field 5 & 6: Age and date of birth -->
        <div class="row">
            <div class="field">
                <label for="age">Age <span class="required">*</span></label>
                <input type="number" id="age" name="age" min="1" max="120">
            </div>
            <div class="field">
                <label for="birthDate">Date of Birth <span class="required">*</span></label>
                <input type="date" id="birthDate" name="birthDate">
            </div>
        </div>

        <!-- Field 7: Street address -->
        <div class="field">
            <label for="address">Street Address <span class="required">*</span></label>
            <input type="text" id="address" name="address" maxlength="100">
        </div>

        <!-- Field 8 & 9: City and state -->
        <div class="row">
            <div class="field">
                <label for="city">City <span class="required">*</span></label>
                <input type="text" id="city" name="city" maxlength="50">
            </div>
            <div class="field">
                <label for="state">State (2 letters) <span class="required">*</span></label>
                <input type="text" id="state" name="state" maxlength="2" placeholder="FL">
            </div>
        </div>

        <!-- Field 10 & 11: ZIP code and contact preference -->
        <div class="row">
            <div class="field">
                <label for="zip">ZIP Code <span class="required">*</span></label>
                <input type="text" id="zip" name="zip" maxlength="10" placeholder="33101">
            </div>
            <div class="field">
                <label for="contactMethod">Preferred Contact <span class="required">*</span></label>
                <select id="contactMethod" name="contactMethod">
                    <option value="">-- Select --</option>
                    <option value="Email">Email</option>
                    <option value="Phone">Phone</option>
                    <option value="Text">Text Message</option>
                </select>
            </div>
        </div>

        <!-- Field 12: Optional comments -->
        <div class="field">
            <label for="comments">Comments (optional)</label>
            <textarea id="comments" name="comments" maxlength="500"></textarea>
        </div>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
        </div>
    </form>
</div>
</body>
</html>
